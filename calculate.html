<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Llogarit BMI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Llogarit BMI</h1>

  <div class="container">
    <form id="bmiForm">
      <input type="number" id="weight" placeholder="Pesha (kg)" required>
      <input type="number" id="height" placeholder="Gjatësia (cm)" required>
      <button type="submit">Llogarit</button>
    </form>

    <p id="result"></p>

    <h2>Historiku i BMI-ve</h2>
    <ul id="history"></ul>

    <button id="clearBtn">Fshij historikun</button>

    <br><br>
    <a href="index.html" class="btn">Kthehu në Homepage</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
