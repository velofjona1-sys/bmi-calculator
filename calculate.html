<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Llogarit BMI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<header class="calc-header">
  <h1>Llogarit BMI</h1>
  <p>Kalkulator + histori + grafik + këshilla</p>
</header>

<section class="calculator">
  <input type="number" id="weight" placeholder="Pesha (kg)">
  <input type="number" id="height" placeholder="Gjatësia (cm)">
  <button onclick="calculateBMI()">Llogarit</button>
  <div style="margin-bottom: 30px;"></div>
  <div id="result"></div>
  <a href="index.html" class="btn" style="margin-top:20px; display:inline-block;">Kthehu tek Homepage</a>
</section>

<section class="chart-section">
  <canvas id="bmiChart"></canvas>
</section>

<section class="bmi-history">
  <h2>Histori BMI</h2>
  <ul id="bmiHistoryList"></ul>
  <button onclick="clearHistory()" class="btn" style="margin-top:10px;">Fshij Historinë</button>
</section>

<section class="bmi-guide">
  <h2>Udhëzues BMI</h2>
  <table>
    <tr>
      <th>BMI</th>
      <th>Kategoria</th>
    </tr>
    <tr><td>&lt; 18.5</td><td>Nën peshë</td></tr>
    <tr><td>18.5 – 24.9</td><td>Normale</td></tr>
    <tr><td>25 – 29.9</td><td>Mbipeshë</td></tr>
    <tr><td>≥ 30</td><td>Obezitet</td></tr>
  </table>
</section>

<section class="api-section">
  <h2>Ushtrim dhe Dietë e Sugjeruar</h2>
  <p id="exercise">Duke u ngarkuar...</p>
  <button onclick="loadExercise()">Ndrysho Ushtrimin</button>
</section>

<footer class="footer">
  <img src="images/meter.png" alt="Footer Image">
  <p>© 2025 BMI Health Guide</p>
</footer>

<script src="script.js"></script>
</body>
</html>
